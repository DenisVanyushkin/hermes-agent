# Probe module definitions for blackbox_exporter.
# Targets live in prometheus.yml, NOT here — adding a target must not
# require touching this file or restarting the exporter.
modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      valid_status_codes: [200]
      follow_redirects: false
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false

  # "We reached the application and it answered sensibly."
  # 401/403 without credentials is HEALTH, not failure.
  http_auth_expected:
    prober: http
    timeout: 10s
    http:
      valid_status_codes: [200, 401, 403]
      follow_redirects: false
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false

  # Minimal "the endpoint exists" — for roots that legitimately 404.
  http_any_alive:
    prober: http
    timeout: 10s
    http:
      valid_status_codes: [200, 401, 403, 404]
      follow_redirects: false
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false

  # adilet.zan.kz serves an incomplete certificate chain; the GoGetSSL
  # intermediate is supplied explicitly.
  http_2xx_adilet:
    prober: http
    timeout: 15s
    http:
      valid_status_codes: [200]
      follow_redirects: false
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      tls_config:
        ca_file: /etc/blackbox/adilet_ca_bundle.pem

  tcp_connect:
    prober: tcp
    timeout: 10s
    tcp:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false

  tcp_tls:
    prober: tcp
    timeout: 10s
    tcp:
      tls: true
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false

  icmp_v4:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false

  # NOTE: for the dns prober the *target* is the resolver being queried, and
  # the name being looked up lives here in `query_name`. That is inverted
  # relative to the http prober. Since query_name is per-module, each name we
  # care about needs its own module.
  dns_a_telegram:
    prober: dns
    timeout: 5s
    dns:
      query_name: api.telegram.org
      query_type: A
      preferred_ip_protocol: ip4
      transport_protocol: udp
      validate_answer_rrs:
        fail_if_not_matches_regexp: ['.*\s+A\s+.*']

  dns_a_openrouter:
    prober: dns
    timeout: 5s
    dns:
      query_name: openrouter.ai
      query_type: A
      preferred_ip_protocol: ip4
      transport_protocol: udp
      validate_answer_rrs:
        fail_if_not_matches_regexp: ['.*\s+A\s+.*']

  dns_a_chatgpt:
    prober: dns
    timeout: 5s
    dns:
      query_name: chatgpt.com
      query_type: A
      preferred_ip_protocol: ip4
      transport_protocol: udp
      validate_answer_rrs:
        fail_if_not_matches_regexp: ['.*\s+A\s+.*']
