  change_policy:
    versioning: >
      Semantic versioning of model_version. MAJOR: removed/renamed fields,
      enum value removal, semantics changes of existing rules. MINOR: new
      rules, new enum values, new optional fields. PATCH: evidence updates,
      status transitions, wording. schema_version tracks the Pydantic contract
      in job_intel/preference_model/model.py and follows the same rules.
    compatibility: >
      Consumers must pin the MAJOR schema_version and must reject a model
      whose MAJOR they do not support. Unknown fields are always a validation
      error (extra=forbid) — additions require a version bump, never silent
      passthrough.
    approval: >
      Any change to this file requires explicit owner (Denis Vanyushkin)
      approval with reason, evidence, affected step, acceptance-criteria
      impact and backward-compatibility note, per process SoT §8. Feedback
      loops may PROPOSE changes; nothing is auto-applied.
    no_silent_learning: true
