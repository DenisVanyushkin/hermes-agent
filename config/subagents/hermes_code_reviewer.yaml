schema_version: 1
id: hermes_code_reviewer
display_name: Hermes Code Reviewer
version: 1
purpose: Reviews material engineering changes, returns a validator-compatible structured review envelope, and acts as the decisive specialist in the reference engineering pipeline.
selection:
  choose_when:
    - engineering pipeline detected material repository changes
    - engineer output and git delta require review
  do_not_choose_when:
    - no material delta exists
    - task is documentation-only or conversational fallback
models:
  default:
    provider: openai-codex
    model: gpt-5.5
    class: senior_review
  allowed:
    - provider: openai-codex
      model: gpt-5.5
      class: senior_review
  escalation:
    allowed: true
    rules:
      - condition: reviewer_output_invalid_twice
        escalate_to:
          provider: openai-codex
          model: gpt-5.5
          class: senior_review
      - condition: disagreement_unresolved_after_allowed_peer_discussion
        escalate_to:
          provider: openai-codex
          model: gpt-5.5
          class: senior_review
  fallback:
    mode: fail_closed
    reason: no approved review model available
tools:
  read:
    - file_read
    - grep
    - git_status
    - git_diff
    - test_result_read
  write: []
  execute: []
  gated: []
  forbidden:
    - file_mutation
    - service_restart
    - git_commit
    - git_push
permissions:
  can_mutate_files: false
  can_restart_services: false
  can_commit: false
  can_push: false
system_prompt:
  path: prompts/subagents/hermes_code_reviewer.md
prompt_cache_policy:
  stable_prompt_prefix_required: true
  preserve_original_prompt_position: true
  dynamic_additions_append_only: true
  dynamic_additions:
    - engineer_output_summary
    - peer_messages
    - escalation_notes
input_schema:
  required:
    - task
    - pipeline_session_id
    - baseline_git_snapshot
    - current_git_snapshot
    - engineer_output
    - changed_files
  optional:
    - peer_messages
    - escalation_reason
    - reviewer_packet
output_schema:
  status:
    enum:
      - succeeded
      - failed
      - blocked
      - needs_review
      - not_invoked
      - disagree_with_reviewer
  required_fields:
    - schema_version
    - subagent_id
    - role
    - status
    - summary
    - blockers
    - artifacts
    - confidence
    - requires_review
    - next_action
  one_of:
    - findings
    - changes
  optional_fields:
    - mutations
    - tests
communication:
  can_send_to:
    - hermes_engineer_core
    - hermes_security_auditor
  can_receive_from:
    - hermes_engineer_core
    - hermes_security_auditor
  channel_policy:
    mode: mediated_by_pipeline
    direct_uncontrolled_chat: false
observability:
  log_selected_provider_model: true
  log_actual_provider_model: true
  log_token_usage: true
  log_cache_usage: true
  log_peer_messages: true
failure_policy:
  invalid_output: pipeline_blocks_or_retries
  model_unavailable: fail_closed
review_contract:
  source_of_truth:
    - reviewer_packet.git
    - reviewer_packet.tests
  engineer_output_policy: best_effort_when_invalid
  test_command_policy:
    compare_semantically: true
    exact_string_match_required: false
    mismatch_alone_is_blocker: false
    accept_equivalent_or_stronger_coverage_when_exit_code_zero: true
