services:
  gateway:
    build: .
    image: hermes-agent
    container_name: hermes
    restart: unless-stopped
    network_mode: host
    volumes:
    - ~/.hermes:/opt/data
    - /home/hermes/.config/trading-autopilot/binance.env:/run/secrets/binance.env:ro
    environment:
    - TRADING_AUTOPILOT_SECRET_FILE=/run/secrets/binance.env
    - HERMES_UID=${HERMES_UID:-10000}
    - HERMES_GID=${HERMES_GID:-10000}
    command:
    - gateway
    - run
  dashboard:
    image: hermes-agent
    container_name: hermes-dashboard
    restart: unless-stopped
    network_mode: host
    depends_on:
    - gateway
    volumes:
    - ~/.hermes:/opt/data
    environment:
    - HERMES_UID=${HERMES_UID:-10000}
    - HERMES_GID=${HERMES_GID:-10000}
    command:
    - dashboard
    - --host
    - 127.0.0.1
    - --no-open
  job_intel_observability:
    build: .
    image: hermes-agent
    container_name: job_intel_observability
    restart: unless-stopped
    network_mode: host
    volumes:
    - ~/.hermes:/opt/data
    environment:
    - HERMES_UID=${HERMES_UID:-10000}
    - HERMES_GID=${HERMES_GID:-10000}
    command:
    - python
    - -c
    - from job_intel.observability import JobIntelObservabilityExporter; from job_intel.store
      import JobIntelStore; from job_intel.runtime import resolve_db_path; store =
      JobIntelStore(resolve_db_path()); exporter = JobIntelObservabilityExporter(store);
      exporter.serve()
