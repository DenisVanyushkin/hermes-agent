core_positioning: >-
  Executive product and digital-business leader who combines product strategy,
  business ownership, monetization, growth, organization building, and
  transformation in complex B2C and B2B2C environments.
short_positioning: >-
  Executive product and digital-business leader for growth, monetization, and
  transformation at scale.

candidate_fact_policy:
  broadening: prohibited
  derived_fields: must_remain_labeled_derived
  conflict_resolution: candidate_facts_win_or_fail_closed

candidate_fact_claims:
  - claim_id: leadership_scope
    statement: Leadership of product and business organizations of approximately 50-90 FTE, with broader commercial organizational responsibility of 170+ employees.
    candidate_fact_pointers:
      - /metrics_index/0
      - /metrics_index/1
      - /metrics_index/2
      - /metrics_index/4
  - claim_id: direct_and_matrix_leadership
    statement: Direct management of 10 reports in the SuperApp tribe and matrix leadership across product organizations.
    candidate_fact_pointers:
      - /experience/0/roles/0/team_scope/direct_reports
      - /experience/1/roles/0/team_scope/matrix_leadership_across_product_tribes
  - claim_id: pnl_and_business_ownership
    statement: Explicit P&L and business-unit responsibility.
    candidate_fact_pointers:
      - /professional_summary/positioning_tags/7
      - /core_competencies/2
  - claim_id: growth_and_monetization
    statement: Acquisition, retention, customer lifecycle, pricing, and monetization experience.
    candidate_fact_pointers:
      - /core_competencies/1
      - /core_competencies/7
      - /metrics_index/6
  - claim_id: portfolio_and_transformation
    statement: Product portfolio, go-to-market, organization design, operating-model transformation, and turnaround experience.
    candidate_fact_pointers:
      - /core_competencies/0
      - /core_competencies/6
      - /core_competencies/9
  - claim_id: launch_pivot_stop
    statement: New-product and new-business-line launches, strategic pivots, and decisions to stop non-viable initiatives.
    candidate_fact_pointers:
      - /experience/2/roles/0/responsibilities/0
      - /experience/0/roles/0/achievements/4
      - /experience/2/roles/0/achievements/4
  - claim_id: executive_context
    statement: Executive and board-level stakeholder work in large-scale consumer products and complex partner environments.
    candidate_fact_pointers:
      - /experience/3/roles/0/responsibilities/2
      - /professional_summary/raw

