schema_version: 1

# ---------------------------------------------------------------------------
# Hermes Role Tool Category Map
#
# Maps tool names to category names used by the role policy evaluator
# (hermes_cli/role_policy.py).  role packages declare allowed_categories in
# their manifest; evaluate_role_tool_policy() uses this map to classify each
# dispatched tool and decide whether to would_block it.
#
# Placeholder categories (marked [PLACEHOLDER]):
#   Some categories are defined but contain only unconfirmed placeholder tool
#   names. These exist so the policy logic compiles and the observe_warn
#   evaluator can produce would_block=True / enforced=False log entries, but
#   they cannot yet enforce anything because no real tool names are mapped.
#
#   Resolving these requires either:
#   (a) identifying the actual tool names used for production deployment / secret
#       access in the live codebase and mapping them here, or
#   (b) implementing a shell-argument classifier that infers the category at
#       runtime from command arguments rather than from a static tool name.
#
#   Until either of those is done, production_deploy and secrets_read are
#   OBSERVE-ONLY PLACEHOLDERS. They will never block real tools even under
#   enforced_tools boundary_mode.
# ---------------------------------------------------------------------------

categories:
  read_only_inspection:
    description: >-
      Tools for viewing files, searching code, inspecting system state, and
      fetching external data. No mutations to files or system state.
    tools:
      - read_file
      - search_files
      - web_search
      - web_extract
      - session_search
      - memory
      - skills_list
      - skill_view
      - browser_navigate
      - browser_click
      - browser_type
      - browser_press
      - browser_scroll
      - browser_back
      - browser_snapshot
      - browser_console
      - browser_get_images
      - browser_vision
      - browser_cdp
      - browser_dialog
      - vision_analyze
      - video_analyze
      - read_terminal
      - x_search
      - ha_list_entities
      - ha_list_services
      - ha_get_state
      - kanban_list
      - kanban_show
      - clarify
      - computer_use
      - feishu_doc_read
      - yb_search_sticker
      - yb_query_group_members
      - yb_query_group_info
      - file_search

  repo_edit:
    description: >-
      Tools for modifying file contents, state, and creating tasks.
      Used for code changes, configuration updates, data file manipulation,
      and message/communication changes.
    tools:
      - write_file
      - patch
      - skill_manage
      - send_message
      - todo
      - kanban_create
      - kanban_complete
      - kanban_link
      - kanban_unblock
      - kanban_block
      - kanban_comment
      - kanban_heartbeat
      - discord
      - discord_admin
      - feishu_drive_add_comment
      - feishu_drive_list_comments
      - feishu_drive_list_comment_replies
      - feishu_drive_reply_comment
      - yb_send_dm
      - yb_send_sticker

  shell_general:
    description: >-
      Tools for executing shell commands, code in sandboxes, and
      delegating tasks to other agents. Includes process control and
      multi-agent coordination.
    tools:
      - terminal
      - execute_code
      - process
      - delegate_task
      - cronjob
      - ha_call_service
      - video_generate
      - text_to_speech
      - mixture_of_agents

  image_generation:
    description: >-
      Image generation and editing via the unified image_generate tool
      (text-to-image and image-to-image). Split out of shell_general so the
      artist role can allow image work without broad shell access.
    tools:
      - image_generate

  # [PLACEHOLDER] — observe-only; enforcement not yet possible.
  # See header comment above for resolution path.
  production_deploy:
    description: >-
      [PLACEHOLDER] Tools for deploying and managing production infrastructure.
      Includes container orchestration and deployment automation.
      No confirmed tool names mapped yet — this category will produce
      would_block=True / enforced=False log entries for advisory observation
      only. Enforcement requires real tool name mapping or a shell-argument
      classifier. Do not use in enforced_tools boundary_mode.
    tools:
      - deploy  # [unconfirmed placeholder — no actual tool by this name exists]

  # [PLACEHOLDER] — observe-only; enforcement not yet possible.
  # See header comment above for resolution path.
  secrets_read:
    description: >-
      [PLACEHOLDER] Tools for accessing secrets, credentials, and sensitive
      configuration. Used for authentication and environment variable management.
      No tool names mapped yet — this category cannot currently block anything.
    tools: []

  # ---------------------------------------------------------------------------
  # Fine-grained read-only categories — pre-v1 taxonomy pass.
  # These are TAXONOMY ONLY in MVP. No enforcement occurs; tools in these
  # categories are still allowed by observe_warn packages. Enforcement will
  # follow in v1 once enforced_tools boundary_mode is activated.
  # ---------------------------------------------------------------------------

  web_search:
    description: >-
      Read-only web search and query tools. Sends search queries to external
      engines; receives results. No mutations. Fine-grained sub-category of
      read_only_inspection for packages that need explicit web-search scope.
    tools:
      - web_search
      - web_extract
      - x_search

  web_browse:
    description: >-
      Read-only browser navigation and web-page inspection tools. Covers
      automated browser actions for reading page content, screenshots, and
      DOM inspection. No form submissions or mutations. Fine-grained
      sub-category of read_only_inspection.
    tools:
      - browser_navigate
      - browser_click
      - browser_type
      - browser_press
      - browser_scroll
      - browser_back
      - browser_snapshot
      - browser_console
      - browser_get_images
      - browser_vision
      - browser_cdp
      - browser_dialog
      - computer_use

  job_intel_read:
    description: >-
      Read-only access to job-intelligence data and state. Covers queries
      against the job_intel SQLite database and pipeline results. No writes
      to the job pipeline; no external job-board scraping.
      [PLACEHOLDER] No confirmed tool names mapped yet — observe-only.
    tools: []
