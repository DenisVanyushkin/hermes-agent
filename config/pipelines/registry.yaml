schema_version: 1
registry:
  - id: default_conversation_pipeline
    display_name: Default Conversation Pipeline
    description: Handles fallback conversational, nontechnical explanatory, planning, and low-risk requests when no specialized pipeline is selected.
    entry_examples:
      - Explain a general nontechnical concept in plain language.
      - Summarize the last run and ask one clarification question.
      - Draft a plan without changing repository files.
      - Prepare application materials for a vacancy — tailored CV, cover letter, recruiter message, or questionnaire answers — via the career-strategist role and recruiter material skills.
      - Подготовь пакет отклика на вакансию (резюме, сопроводительное письмо, сообщение рекрутеру, ответы на анкету).
    exclusion_examples:
      - Fix the bug in gateway routing.
      - Modify tests and patch the repo.
      - Diagnose why a cron job used the wrong model provider.
    risk_notes:
      - no file mutation allowed
      - safe fallback only
      - reclassify if specialized workflow is required
      - routing_failed fallback requires fallback_safe == true
    allowed_router_statuses:
      - no_specialized_pipeline
      - routing_failed
    fallback_eligible: true
    mutation_risk: none
    required_subagents:
      - general_operator
    config_path: config/pipelines/default_conversation_pipeline.yaml
  - id: engineering_review_pipeline
    display_name: Engineering Review Pipeline
    description: Handles code and infrastructure diagnostics plus code, config, script, and test changes with engineer and reviewer subagents.
    entry_examples:
      - Fix the routing bug and update tests.
      - Patch the architecture YAML specs.
      - Make a repo change and run validation.
      - Diagnose why a cron job used OpenRouter instead of the configured base model.
      - Explain how an agent request was routed by inspecting logs and configuration.
    exclusion_examples:
      - Continue a casual nontechnical conversation.
      - Acknowledge the previous response without asking for technical work.
      - Ask a general planning question unrelated to code or infrastructure.
    risk_notes:
      - may mutate repository
      - requires baseline capture before changes
      - requires review for material changes
      - may involve security auditor for security-sensitive deltas
    allowed_router_statuses:
      - selected
    fallback_eligible: false
    mutation_risk: repository
    required_subagents:
      - hermes_engineer_core
      - hermes_code_reviewer
    config_path: config/pipelines/engineering_review_pipeline.yaml
  - id: recruiter_decision_support_pipeline
    display_name: Recruiter Decision Support Pipeline
    description: Handles recruiter/HR analysis requests — vacancy assessment, company diligence, fit recommendation, positioning, claims, and interview questions — via draft-only modular analysis with manual review. Does NOT prepare application materials (CV, cover letter, recruiter message, questionnaire answers); those go to the default conversation pipeline with the career-strategist role.
    entry_examples:
      - Evaluate this vacancy and tell me whether I should apply.
      - Research the company behind this job posting and list its risks.
      - Оцени вакансию и скажи, стоит ли податься.
      - Подготовь вопросы к рекрутеру перед скринингом.
    exclusion_examples:
      - Fix the recruiter routing code and update tests.
      - Explain how the recruiter pipeline works without running it.
      - Draft a thank-you email for a dinner invitation.
      - Prepare application materials for this vacancy (tailored CV, cover letter, recruiter message, questionnaire answers).
      - Подготовь пакет отклика на вакансию / подготовь резюме и сопроводительное письмо под вакансию.
    risk_notes:
      - no repository mutation allowed
      - no outbound messages, no application submission
      - no CRM or job-intel writes
      - draft-only outputs with manual review required
    allowed_router_statuses:
      - selected
    fallback_eligible: false
    mutation_risk: none
    required_subagents:
      - general_operator
    config_path: config/pipelines/recruiter_decision_support_pipeline.yaml
